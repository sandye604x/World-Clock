<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="src/style.css"/>
    <title>World Clock Project</title>
</head>
<body>
    <div class="container">
        <h1>World Clock</h1>
    

    <main>
        <select name="selectcity" id="selectcity">
            <option value="">Select a city.. </option>
            <option value="switzerland">Switzerland</option>
            <option value="Luxembourg">Luxembourg</option>
            <option value="sydney">Sydney <img src="src/au.png"/></option>
        </select>


    <div class="displaycity">
    <div id="city">Sydney <img src="src/au.png"/></div>
    <div class="time">1:48:57 <span class="A">AM</span></div></div>
    <div class="date">September 27th 2026 </div> 

    <div class="displaycity">
    <div id="city">Switzerland <img src="src/ch.png" width="20"/></div>
    <div class="time">10:48:57 <span class="A">PM</span></div></div>
    <div class="date">September 26th 2026 </div> 
  
      
    </main>
  
 

 <footer>
    This project was coded by SE and is <a href="https://se-worldclock.netlify.app/" target="">open-sourced on GitHub</a>
 </footer>
 </div>
</body>
<script src="src/index.js"></script>
</html>
